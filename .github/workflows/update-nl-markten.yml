name: Update NL markten data

on:
  schedule:
    - cron: "0 3 * * *"   # dagelijks om 03:00 UTC (05:00 zomertijd NL)
  workflow_dispatch: {}     # handmatig te starten via de Actions-tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Haal NL markten op
        run: node scripts/fetch-nl-markten.js

      - name: Commit en push als er wijzigingen zijn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nl-markten.json scripts/geocode-cache.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen, niets te committen."
          else
            git commit -m "Automatische update NL markten-data"
            git push
          fi
